# Esteira Rust reutilizável da SatMed. Os repos chamam com workflow_call, fixando o SHA.
# Nenhum job aqui recebe segredo nem credencial de nuvem.
name: rust-ci

on:
  workflow_call:
    inputs:
      rust-version:
        type: string
        default: "1.99.0"
      runner:
        description: Imagem do runner. Fixada; o canário passa ubuntu-latest.
        type: string
        default: ubuntu-24.04
      workdir:
        description: Pasta do crate (o canário usa canary/rust).
        type: string
        default: "."

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: ${{ inputs.rust-version }}
  GITLEAKS_VERSION: 8.30.1
  CARGO_DENY_VERSION: 0.20.2
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  secrets:
    name: secrets
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (versão fixa + checksum)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Gitleaks no histórico inteiro
        run: ./gitleaks git --redact -v .

  lint:
    name: lint
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (versão fixa)
        working-directory: ${{ inputs.workdir }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt,clippy && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.workdir }}
      - name: Título do PR (Conventional Commits; no squash ele vira o commit da main)
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }} # via env: título é entrada do usuário
        shell: bash
        run: |
          re='^(feat|fix|ci|refactor|chore|docs|test|build|perf|revert)(\([a-z0-9/-]+\))?!?: [^ ].*[^.]$'
          [[ "$TITULO" =~ $re ]] || { echo "::error::título fora do padrão: '$TITULO' (ex.: feat(api): add login)"; exit 1; }
          echo "ok  $TITULO"
      - name: Install actionlint (versão fixa + checksum)
        run: |
          f=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$ACTIONLINT_SHA256  $f" | sha256sum -c -
          tar xzf "$f" actionlint
      - name: Workflows (actionlint + shellcheck)
        run: ./actionlint -color
      - name: Formatação
        working-directory: ${{ inputs.workdir }}
        run: cargo fmt --check
      - name: Clippy (aviso vira erro)
        working-directory: ${{ inputs.workdir }}
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (versão fixa)
        working-directory: ${{ inputs.workdir }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.workdir }}
      - name: Testes (Cargo.lock é a verdade)
        working-directory: ${{ inputs.workdir }}
        run: cargo test --locked

  supply-chain:
    name: supply-chain
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny (versão fixa + checksum)
        working-directory: ${{ inputs.workdir }}
        run: |
          f=cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz
          base=https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}
          curl -sSfLO "$base/$f"
          echo "$(curl -sSfL "$base/$f.sha256" | awk '{print $1}')  $f" | sha256sum -c -
          tar xzf "$f" --strip-components=1
      - name: cargo-deny (CVE, licença, origem, versão curinga)
        working-directory: ${{ inputs.workdir }}
        run: ./cargo-deny check
      - name: Aceites de risco têm data e não venceram
        working-directory: ${{ inputs.workdir }}
        shell: bash
        run: |
          set -euo pipefail
          hoje=$(date -u +%F)
          ativos=$(grep -E '^\s*\{ id = "RUSTSEC' deny.toml || true)
          n=$(printf '%s\n' "$ativos" | grep -c 'RUSTSEC' || true)
          com_data=$(printf '%s\n' "$ativos" | grep -c 'Revisar até [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' || true)
          [ "$n" = "$com_data" ] || { echo "::error::todo aceite precisa de 'Revisar até AAAA-MM-DD' ($com_data de $n têm)"; exit 1; }
          falhou=0
          while read -r id data; do
            if [[ "$data" < "$hoje" ]]; then echo "::error::aceite de $id venceu em $data: reavaliar"; falhou=1
            else echo "ok  $id válido até $data"; fi
          done < <(printf '%s\n' "$ativos" | sed -nE 's/.*id = "(RUSTSEC-[0-9-]+)".*Revisar até ([0-9-]{10}).*/\1 \2/p')
          exit $falhou
