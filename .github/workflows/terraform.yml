# Governança aplicada pelo CI, não pelo laptop.
#   PR       → plan (app só-leitura, role AWS só-leitura). Resumo no job, sem o diff (repo público).
#   main     → apply, depois que um humano aprova o environment github-apply.
#   diário   → drift (plan tem que dar 0) + 2FA da org (fica fora do Terraform).
# Credencial nenhuma é fixa: token da GitHub App e credencial AWS valem 1 hora.
# Desligado até o bootstrap terminar: vars.TF_CI_ENABLED == 'true' (scripts/bootstrap-state.sh).
name: terraform

on:
  pull_request:
    paths:
      - "terraform/github/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/github/**"
      - ".github/workflows/terraform.yml"
  schedule:
    - cron: "0 11 * * *" # todo dia, 08:00 em Brasília
  workflow_dispatch:

permissions: {}

# Um por vez, e nunca cancela no meio: apply interrompido = state pela metade.
concurrency:
  group: terraform-github
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.4
  TF_DIR: terraform/github
  AWS_REGION: sa-east-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: plan
    # Dependabot não recebe secrets de environment: o bump de provider é planejado no apply.
    if: >-
      vars.TF_CI_ENABLED == 'true' && github.event_name != 'push'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    environment: github-plan
    permissions:
      contents: read
      id-token: write # troca o token OIDC por credencial AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Token da GitHub App (só leitura)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_APP_CLIENT_ID }}
          private-key: ${{ secrets.TF_APP_PRIVATE_KEY }}
          owner: satmed

      - name: Credencial AWS (role de plan, 1 hora)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }} # via env, nunca interpolado no script
        run: terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          TF_VAR_billing_email: ${{ secrets.TF_VAR_BILLING_EMAIL }}
        run: |
          # O diff fica fora do log (repo público); o resumo abaixo diz o que muda.
          rc=0
          terraform -chdir="$TF_DIR" plan -lock=false -detailed-exitcode -out=tfplan > /dev/null || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" != 1 ] || { echo "::error::terraform plan falhou"; exit 1; }

      - name: Resumo do plan
        run: |
          {
            echo "### terraform plan (${TF_DIR})"
            terraform -chdir="$TF_DIR" show -json tfplan | jq -r '
              [.resource_changes[] | select(.change.actions != ["no-op"])] as $c
              | if ($c | length) == 0 then "Sem mudanças: código e GitHub batem."
                else ($c[] | "- `\(.change.actions | join("+"))` \(.address)") end'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$TF_DIR/tfplan"

      - name: Drift (agendado)
        if: github.event_name == 'schedule' && steps.plan.outputs.rc == '2'
        run: |
          echo "::error::drift: o GitHub mudou fora do Terraform (veja o resumo). Corrija no código ou desfaça a mudança manual."
          exit 1

  two-factor:
    name: 2FA da org
    if: vars.TF_CI_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: github-plan
    permissions: {}
    steps:
      - name: Token da GitHub App (só leitura)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_APP_CLIENT_ID }}
          private-key: ${{ secrets.TF_APP_PRIVATE_KEY }}
          owner: satmed

      - name: 2FA obrigatório e ninguém sem 2FA
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          exigido=$(gh api orgs/satmed --jq .two_factor_requirement_enabled)
          sem=$(gh api 'orgs/satmed/members?filter=2fa_disabled' --jq length)
          echo "2FA exigido: $exigido · membros sem 2FA: $sem"
          [ "$exigido" = true ] || { echo "::error::a org deixou de exigir 2FA"; exit 1; }
          [ "$sem" = 0 ] || { echo "::error::$sem membro(s) sem 2FA"; exit 1; }

  apply:
    name: apply
    if: vars.TF_CI_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: github-apply # pausa aqui até um humano aprovar
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Token da GitHub App (escrita)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_APP_CLIENT_ID }}
          private-key: ${{ secrets.TF_APP_PRIVATE_KEY }}
          owner: satmed

      - name: Credencial AWS (role de apply, 1 hora)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }} # via env, nunca interpolado no script
        run: terraform -chdir="$TF_DIR" init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Plan, apply do plano salvo e prova
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          TF_VAR_billing_email: ${{ secrets.TF_VAR_BILLING_EMAIL }}
        run: |
          rc=0
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -out=tfplan > /dev/null || rc=$?
          case $rc in
            0) echo "Nada a aplicar." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            2) ;;
            *) echo "::error::terraform plan falhou"; exit 1 ;;
          esac
          {
            echo "### terraform apply (${TF_DIR})"
            terraform -chdir="$TF_DIR" show -json tfplan | jq -r '.resource_changes[]
              | select(.change.actions != ["no-op"]) | "- `\(.change.actions | join("+"))` \(.address)"'
          } >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir="$TF_DIR" apply -no-color tfplan > /dev/null
          rm -f "$TF_DIR/tfplan"
          terraform -chdir="$TF_DIR" plan -detailed-exitcode -lock=false > /dev/null \
            || { echo "::error::ainda há diferença depois do apply"; exit 1; }
          echo "PROVA OK: No changes depois do apply." >> "$GITHUB_STEP_SUMMARY"
