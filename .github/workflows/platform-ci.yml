# CI do platform: os MESMOS hooks do laptop, agora no servidor, onde ninguém pula.
# Este job não recebe nenhum segredo nem credencial de nuvem.
name: platform-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: título corrigido roda de novo
  push:
    branches: [main]
  workflow_call: # o canário chama este mesmo workflow em outro runner
    inputs:
      runner:
        type: string
        default: ubuntu-24.04

permissions: {} # padrão = nada; o job pede só o que precisa

jobs:
  static-checks:
    name: static-checks
    # Fixado: ubuntu-latest é um apelido que muda sozinho. Atualizar = PR.
    # Em PR/push o inputs.runner vem vazio, por isso o padrão depois do ||.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico inteiro, para o gitleaks
          persist-credentials: false # não deixa o token no .git do runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Install gitleaks (versão fixa + checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Install actionlint (versão fixa + checksum)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$ACTIONLINT_SHA256  $f" | sha256sum -c -
          tar xzf "$f" actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Título do PR (Conventional Commits; no squash ele vira o commit da main)
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }} # via env: título é entrada do usuário
        run: |
          re='^(feat|fix|ci|refactor|chore|docs|test|build|perf|revert)(\([a-z0-9/-]+\))?!?: [^ ].*[^.]$'
          [[ "$TITULO" =~ $re ]] || { echo "::error::título fora do padrão: '$TITULO' (ex.: feat(api): add login)"; exit 1; }
          echo "ok  $TITULO"

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: Pre-commit (mesmos hooks do laptop)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Gitleaks no histórico inteiro
        run: gitleaks git --redact -v .

      - name: Terraform validate (sem backend, sem credencial)
        run: |
          terraform -chdir=terraform/github init -backend=false
          terraform -chdir=terraform/github validate
