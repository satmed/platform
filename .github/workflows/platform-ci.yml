# CI do platform: os MESMOS hooks do laptop, agora no servidor, onde ninguém pula.
# Este job não recebe nenhum segredo nem credencial de nuvem.
name: platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {} # padrão = nada; o job pede só o que precisa

jobs:
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico inteiro, para o gitleaks
          persist-credentials: false # não deixa o token no .git do runner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Install gitleaks (versão fixa + checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: Pre-commit (mesmos hooks do laptop)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Gitleaks no histórico inteiro
        run: gitleaks git --redact -v .

      - name: Terraform validate (sem backend, sem credencial)
        run: |
          terraform -chdir=terraform/github init -backend=false
          terraform -chdir=terraform/github validate
